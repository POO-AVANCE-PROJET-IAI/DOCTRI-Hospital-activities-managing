<h2 class="text-2xl font-bold mb-6 text-center">Ajouter un Acte Médical</h2>
<form method="post" class="bg-white shadow-md rounded-lg p-8 max-w-md w-full">
  {% csrf_token %}
  {% if messages %}
    {% for message in messages %}
      <div class="text-green-700">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% for field in form %}
    <div class="mb-4">
      <label for="{{ field.id_for_label }}" class="block text-gray-700 text-sm font-bold mb-2">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <p class="text-red-500 text-xs italic">{{ field.errors }}</p>
      {% endif %}
    </div>
  {% endfor %}

  <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
    Mettre à jour
  </button>
</form>
