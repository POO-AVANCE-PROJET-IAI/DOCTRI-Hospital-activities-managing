{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}DOCTRI{% endblock %}</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'dist/styles.css' %}" />
    <style>
      .panel {
        transition: transform 0.3s ease-in-out;
        transform: translateX(100%);
      }
      .panel-active {
        transform: translateX(0);
      }
      .overlay {
        transition: opacity 0.3s ease-in-out;
        opacity: 0;
        pointer-events: none;
      }
      .overlay-active {
        opacity: 0.5;
        pointer-events: all;
      }
    </style>
  </head>

  <body class="flex max-h-screen h-screen bg-gray-100 w-screen overflow-hidden">
    {% if user.is_authenticated %} {% include "header.html" %} {% endif %}
    <main class="ml-20 h-screen overflow-y-auto w-full">
      {% block content %} {% endblock content %}
    </main>
    {% include "footer.html" %}

    <script src="" async defer></script>
  </body>
</html>
