<h3 class="text-lg font-medium text-gray-900 mb-4 text-center">
  Listes des ordonnances
</h3>
<table class="w-full">
  <thead>
    <tr class="bg-gray-200">
      <th class="px-4 py-2 text-left text-sm font-medium">Date Ordonnance</th>
      <th class="px-4 py-2 text-left text-sm font-medium">Acte effectué</th>
      <th class="px-4 py-2 text-left text-sm font-medium">Médecin associé</th>
      <th class="px-4 py-2 text-left text-sm font-medium">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for ordonnance in ordonnances %}

    <tr>
      <td class="border px-4 py-2 text-sm">{{ ordonnance.date_ordonnance}}</td>
      <td class="border px-4 py-2 text-sm">
        {{ ordonnance.consultation.acte }}
      </td>
      <td class="border px-4 py-2 text-sm">
        {{ ordonnance.medecin.nom }} {{ ordonnance.medecin.prenom }}
      </td>
      <td class="border px-4 py-2 text-sm">
        <button class="bg-green-600 p-1 rounded text-white">
          <a
            href="{% url 'ordonnance.imprimer' ordonnance.id %}"
            target="_blank"
            class="text-white hover:underline"
          >
            Imprimer l'ordonnance
          </a>
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
